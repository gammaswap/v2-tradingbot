name: Compile/Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Build
        run: pnpm run build
      - name: Run Tests
        run: pnpm test
      - name: Run Typecheck
        run: pnpm typecheck
      - name: Run Lint
        run: pnpm lint
      - name: Check Formatting
        run: pnpm format:check
      - name: Validate Package
        run: pnpm validate:package
