name: Verify package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Build
        run: pnpm run build
      - name: Run Tests
        run: pnpm test
      - name: Run Typecheck
        run: pnpm typecheck
      - name: Run Lint
        run: pnpm lint
      - name: Check Formatting
        run: pnpm format:check
      - name: Validate packed package
        run: pnpm validate:package
